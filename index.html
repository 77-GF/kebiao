<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#3b5bdb" />
<title>我的课表</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --text: #1a1c22;
    --text-2: #6b7280;
    --border: #e5e7eb;
    --primary: #3b5bdb;
    --primary-ink: #ffffff;
    --danger: #e03131;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0,0,0,.10);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #191c22;
      --surface-2: #23272f;
      --text: #e7e9ee;
      --text-2: #9aa1ad;
      --border: #2b303a;
      --primary: #5b7cfa;
      --primary-ink: #ffffff;
      --danger: #ff6b6b;
      --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: calc(8px + var(--safe-t));
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px; }
  .brand { font-weight: 700; font-size: 17px; margin-right: auto; display:flex; align-items:center; gap:8px; }
  .brand .dot { width:10px;height:10px;border-radius:3px;background:var(--primary); }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 7px 11px; font-size: 13px; cursor: pointer;
    display:inline-flex; align-items:center; gap:5px; white-space: nowrap; transition: .15s;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight:600; }
  .btn.icon { padding: 7px 9px; }
  .seg { display:flex; background: var(--surface-2); border-radius:10px; padding:3px; gap:2px; }
  .seg button {
    border:none; background:transparent; color:var(--text-2); font-size:13px;
    padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .seg button.on { background: var(--surface); color: var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }

  /* 周次导航条 */
  .weekbar {
    display:flex; align-items:center; gap:8px; padding:0 12px 10px;
    font-size:13px; color:var(--text-2);
  }
  .week-label { font-weight:700; font-size:16px; color:var(--text); padding:0 2px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .week-label em { font-style:normal; font-size:10px; color:var(--primary); background:var(--surface-2); padding:2px 7px; border-radius:999px; font-weight:600; }
  .weekbar .today-badge { margin-left:auto; color:var(--primary); font-weight:600; white-space:nowrap; }

  .chip { padding:3px 9px; border-radius:999px; border:1px solid var(--border); white-space:nowrap; font-size:12px; cursor:pointer; }
  .chip.on { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); font-weight:600; }

  /* ---------- Week grid ---------- */
  .grid-wrap { overflow-x:auto; padding: 12px; scrollbar-width: thin; }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; }
  table.grid th, table.grid td { border: 1px solid var(--border); }
  table.grid thead th { position: sticky; top: 0; z-index: 5; background: var(--surface); font-weight:600; font-size:13px; padding:8px 4px; }
  table.grid thead th.today { color: var(--primary); }
  table.grid thead th .d { display:block; font-size:10px; color:var(--text-2); font-weight:400; }
  .col-time { position: sticky; left: 0; z-index: 6; background: var(--surface); width: 46px; }
  .col-time .no { font-weight:700; font-size:12px; display:block; }
  .col-time .tm { font-size:9px; color:var(--text-2); display:block; line-height:1.2; }
  td.cell { position:relative; height: 56px; padding:3px; vertical-align:top; font-size:11px; cursor:pointer; transition: .12s; }
  td.cell:active { opacity:.85; }
  td.cell.odd-col { background: var(--surface-2); }
  td.cell.row-now { outline: 2px solid var(--primary); outline-offset:-2px; }
  .course { border-radius: 8px; padding: 4px 5px; height: 100%; overflow: hidden; display:flex; flex-direction:column; gap:1px; color:#fff; line-height:1.25; }
  .course .nm { font-weight:700; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .course .sub { font-size:9.5px; opacity:.92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .course.lite { color: var(--text); }
  .course.plan { outline: 1.5px dashed currentColor; outline-offset: -1.5px; }

  /* ---------- Day view ---------- */
  .dayview { padding: 12px 12px calc(24px + var(--safe-b)); }
  .day-head { font-size:20px; font-weight:700; margin: 6px 2px 12px; }
  .day-head small { font-weight:400; font-size:12px; color:var(--text-2); margin-left:8px; }
  .slot { display:flex; gap:12px; margin-bottom:10px; }
  .slot .when { width:58px; text-align:right; font-size:11px; color:var(--text-2); flex-shrink:0; padding-top:4px; line-height:1.4; }
  .slot .when b { display:block; color:var(--text); font-size:13px; }
  .card { flex:1; border-radius: var(--radius); padding:12px 14px; color:#fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); display:flex; flex-direction:column; gap:4px; cursor:pointer; position:relative; }
  .card:active{transform:scale(.99)}
  .card .nm { font-weight:700; font-size:16px; }
  .card .meta { font-size:12.5px; opacity:.95; display:flex; flex-wrap:wrap; gap:6px 14px; }
  .card .meta span { display:inline-flex; align-items:center; gap:4px; }
  .card .badge { position:absolute; top:-1px; right:10px; font-size:10px; background:rgba(0,0,0,.22); padding:2px 7px; border-radius:0 0 8px 8px; }
  .card.plan { outline: 2px dashed currentColor; outline-offset: -2px; }

  .empty { text-align:center; color:var(--text-2); padding:48px 16px; }
  .empty .big { font-size:40px; margin-bottom:8px; }

  /* ---------- Modal ---------- */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .mask.show { display:flex; }
  .sheet {
    background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding: 8px 18px calc(20px + var(--safe-b)); max-height: 92vh; overflow-y:auto; animation: up .25s ease;
  }
  @keyframes up { from{transform:translateY(40px);opacity:0} to{transform:none;opacity:1} }
  .sheet h3 { font-size:17px; margin:12px 0 4px; }
  .sheet .sub-hint { font-size:12px; color:var(--text-2); margin:0 0 12px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field textarea {
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; outline:none; font-family:inherit;
  }
  .field input:focus, .field textarea:focus { border-color: var(--primary); }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .num-stepper { display:flex; align-items:center; gap:8px; }
  .num-stepper button { width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:18px;cursor:pointer;color:var(--text); }
  .num-stepper .val { font-size:18px; font-weight:700; min-width:24px; text-align:center; }
  .swatches { display:flex; flex-wrap:wrap; gap:9px; }
  .swatches .sw { width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent; transition:.12s; }
  .swatches .sw.on { border-color: var(--text); transform: scale(1.1); }
  .week-preview { font-size:12px; color:var(--text-2); margin-top:7px; }
  .week-preview b { color:var(--primary); font-weight:600; }
  .sheet-actions { display:flex; gap:10px; margin-top:8px; }
  .sheet-actions .btn { flex:1; justify-content:center; padding:13px; font-size:15px; }
  .btn.danger { color:var(--danger); border-color: var(--danger); }

  .fab {
    position: fixed; right:18px; bottom: calc(20px + var(--safe-b)); z-index:30;
    width:56px; height:56px; border-radius:50%; background:var(--primary); color:var(--primary-ink);
    border:none; font-size:28px; box-shadow:0 8px 24px rgba(59,91,219,.4); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{transform:scale(.94)}
  .toast {
    position:fixed; left:50%; bottom: calc(30px + var(--safe-b)); transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:.3s; z-index:60;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span>我的课表</div>
    <div class="seg" id="viewSeg">
      <button data-view="day">日</button>
      <button data-view="week">周</button>
    </div>
    <button class="btn icon" id="btnToday" title="回到本周·今天">今天</button>
    <button class="btn icon" id="btnMenu" title="菜单">⋮</button>
  </div>
  <div class="weekbar" id="weekbar"></div>
</header>

<main id="main"></main>

<button class="fab" id="fab">＋</button>
<div class="toast" id="toast"></div>

<!-- 课程编辑器 -->
<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="mTitle">添加课程</h3>
    <p class="sub-hint" id="mHint"></p>
    <div class="field">
      <label>类型</label>
      <div class="seg" id="fType">
        <button data-t="course" class="on">📚 课程</button>
        <button data-t="plan">📌 计划</button>
      </div>
    </div>
    <div class="field">
      <label id="fNameLabel">课程名称 *</label>
      <input type="text" id="fName" placeholder="如：高等数学" />
    </div>
    <div class="row2">
      <div class="field" id="fTeacherField"><label>教师</label><input type="text" id="fTeacher" placeholder="教师姓名" /></div>
      <div class="field"><label id="fRoomLabel">教室</label><input type="text" id="fRoom" placeholder="如：教一 201" /></div>
    </div>
    <div class="field">
      <label>星期</label>
      <div class="seg" id="fDay" style="width:100%; overflow-x:auto;"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>起始节次</label>
        <div class="num-stepper">
          <button data-step="-1">−</button><span class="val" id="fStartV">1</span><button data-step="1">＋</button>
        </div>
      </div>
      <div class="field">
        <label>结束节次</label>
        <div class="num-stepper">
          <button data-step="-1">−</button><span class="val" id="fEndV">2</span><button data-step="1">＋</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>周次（这门课在第几周上）</label>
      <div class="seg" id="fWeeks">
        <button data-w="all" class="on">每周</button>
        <button data-w="odd">单周</button>
        <button data-w="even">双周</button>
        <button data-w="custom">自定义</button>
      </div>
      <div id="fWeekCustomWrap" style="display:none;margin-top:8px">
        <input type="text" id="fWeekCustom" placeholder="如 1-8 或 1,3,5 或 1-8,10-16" />
      </div>
      <div class="week-preview" id="fWeekPreview"></div>
    </div>
    <div class="field">
      <label>颜色</label>
      <div class="swatches" id="fColor"></div>
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <input type="text" id="fNote" placeholder="如：带教材 / 需提前占座" />
    </div>
    <div class="sheet-actions">
      <button class="btn danger" id="fDelete" style="display:none">删除</button>
      <button class="btn" id="fCancel">取消</button>
      <button class="btn primary" id="fSave">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
const PALETTE = ['#3b5bdb','#2f9e44','#e8590c','#e03131','#9c36b5','#0b7285','#c92a2a','#364fc7','#2b8a3e','#d9480f','#5f3dc4','#0ca678','#e64980','#1971c2','#f08c00'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hexRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function isLight(hex){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b) > 160;
}

const DEFAULT_TIMES = [
  ['08:00','08:45'],['08:55','09:40'],['10:10','10:55'],['11:05','11:50'],
  ['14:00','14:45'],['14:55','15:40'],['16:00','16:45'],['16:55','17:40'],
  ['19:00','19:45'],['19:55','20:40'],
];

/* ================= 周次工具 ================= */
function rangeOdd(total){ const a=[]; for(let i=1;i<=total;i+=2)a.push(i); return a; }
function rangeEven(total){ const a=[]; for(let i=2;i<=total;i+=2)a.push(i); return a; }
// 把周次数组压缩成 "1-8" 或 "1,3,5" 文本
function compressWeeks(arr){
  if(!arr || arr.length===0) return '';
  const a = [...arr].sort((x,y)=>x-y);
  const out=[]; let s=a[0], p=a[0];
  for(let i=1;i<a.length;i++){
    if(a[i]===p+1){ p=a[i]; }
    else { out.push(s===p?`${s}`:`${s}-${p}`); s=p=a[i]; }
  }
  out.push(s===p?`${s}`:`${s}-${p}`);
  return out.join(',');
}
function fmtWeeks(arr){
  if(!arr || arr.length===0) return '每周';
  return compressWeeks(arr)+'周';
}
function parseWeekText(txt, total){
  const res=[], seen={};
  String(txt||'').split(/[,，、\s]+/).forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    const parts = seg.split(/[-~—–]/);
    if(parts.length===2){
      const a=parseInt(parts[0]), b=parseInt(parts[1]);
      if(!isNaN(a) && !isNaN(b)){ for(let i=Math.min(a,b); i<=Math.max(a,b); i++) res.push(i); }
    } else {
      const n=parseInt(seg); if(!isNaN(n)) res.push(n);
    }
  });
  res.forEach(n=>{ if(n>=1 && n<=total) seen[n]=1; });
  return Object.keys(seen).map(Number).sort((a,b)=>a-b);
}
const arrEq = (a,b)=> a.length===b.length && a.every((x,i)=>x===b[i]);

/* ================= 状态 ================= */
const KEY = 'kebiao-v1';
function loadState(){
  const d = { courses:[], view:'week', times:DEFAULT_TIMES, semesterStart:'', totalWeeks:20, viewWeek:null };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if(s) Object.assign(d,s); } catch(e){}
  if (!Array.isArray(d.times) || d.times.length===0) d.times = DEFAULT_TIMES;
  // 迁移：旧版默认 12 节时间表 → 新版 10 节（第3节10:10、第4节11:05，去掉11、12节）
  if (Array.isArray(d.times) && d.times.length===12 && d.times[0] && d.times[0][0]==='08:00' && d.times[2] && d.times[2][0]==='10:00'){
    d.times = DEFAULT_TIMES;
  }
  d.totalWeeks = (Number(d.totalWeeks)||0) > 0 ? Number(d.totalWeeks) : 20;
  // 迁移旧版 weeks（字符串 all/odd/even → 周次数组）
  d.courses.forEach(c=>{
    if (typeof c.weeks === 'string'){
      c.weeks = c.weeks==='odd' ? rangeOdd(d.totalWeeks) : c.weeks==='even' ? rangeEven(d.totalWeeks) : [];
    }
    if (!Array.isArray(c.weeks)) c.weeks = [];
    if (!c.type) c.type = 'course';
  });
  return d;
}
const state = loadState();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

const now = new Date();
const todayIdx = (now.getDay()+6)%7; // 周一=0
let selectedDay = todayIdx;
let editingId = null;

function realWeek(){
  if (state.semesterStart){
    const start = new Date(state.semesterStart + 'T00:00:00');
    const diff = Math.floor((new Date() - start)/86400000);
    if (diff >= 0) return Math.floor(diff/7)+1;
  }
  return 1;
}
function viewWeek(){ return state.viewWeek || realWeek(); }

function inWeek(c, w){
  if (!c.weeks || c.weeks.length===0) return true; // 每周
  return c.weeks.includes(w);
}

/* ================= 视图切换 ================= */
function setView(v){
  state.view = v; save();
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  render();
}

function render(){
  $('weekbar').innerHTML = buildWeekbar();
  $('main').innerHTML = state.view==='week' ? buildWeek() : buildDay();
}

/* ================= 顶部周次导航 ================= */
function buildWeekbar(){
  const real = realWeek();
  const w = viewWeek();
  const isReal = (w===real);
  return `
    <button class="btn icon" data-nav="-1" title="上一周">◀</button>
    <div class="week-label" data-jump="1" title="点击跳转周次">第 ${w} 周${isReal?'<em>本周</em>':''}</div>
    <button class="btn icon" data-nav="1" title="下一周">▶</button>
    <span class="today-badge">今天 ${DAY_NAMES[todayIdx]}</span>`;
}
function setWeek(w){
  w = clamp(w, 1, state.totalWeeks);
  state.viewWeek = (w === realWeek()) ? null : w;
  render();
}

/* ================= 周视图 ================= */
function weekBlock(c){
  const weeksTxt = (c.weeks && c.weeks.length) ? `<span class="sub">${fmtWeeks(c.weeks)}</span>` : '';
  if (c.type === 'plan'){
    return `<div class="course plan" style="background:${hexRgba(c.color,0.10)};color:${c.color}" data-id="${c.id}">
      <span class="nm">📌 ${esc(c.name)}</span>
      ${c.room?`<span class="sub">${esc(c.room)}</span>`:''}
      ${weeksTxt}
    </div>`;
  }
  return `<div class="course ${isLight(c.color)?'lite':''}" style="background:${hexRgba(c.color, isLight(c.color)?0.22:0.95)}" data-id="${c.id}">
    <span class="nm">${esc(c.name)}</span>
    ${c.room?`<span class="sub">${esc(c.room)}</span>`:''}
    ${c.teacher?`<span class="sub">${esc(c.teacher)}</span>`:''}
    ${weeksTxt}
  </div>`;
}
function buildWeek(){
  const nSec = state.times.length;
  const w = viewWeek();
  const grid = [];
  for (let s=0;s<nSec;s++) grid[s] = new Array(7).fill(null);
  state.courses.forEach(c=>{
    if (!inWeek(c,w)) return;
    for (let s=c.startSection-1; s<c.endSection && s<nSec; s++){
      grid[s][c.day] = (s===c.startSection-1) ? c : 'covered';
    }
  });

  let rows = `<table class="grid"><thead><tr><th class="col-time"></th>`;
  DAY_NAMES.forEach((d,i)=>{
    rows += `<th class="${i===todayIdx?'today':''}">${d}<span class="d">${i===todayIdx?'今天':''}</span></th>`;
  });
  rows += `</tr></thead><tbody>`;
  const nowSec = currentSection();
  for (let s=0;s<nSec;s++){
    rows += `<tr><td class="col-time"><span class="no">${s+1}</span><span class="tm">${state.times[s][0]}</span></td>`;
    for (let d=0;d<7;d++){
      const v = grid[s][d];
      if (v === 'covered') continue;
      const c = v;
      const cls = ['cell', d%2===1?'odd-col':''];
      if (d===todayIdx) cls.push('today');
      if (s===nowSec) cls.push('row-now');
      let inner='', rowspan=1, attr='';
      if (c){
        rowspan = c.endSection - c.startSection + 1;
        inner = weekBlock(c);
        attr = `data-id="${c.id}"`;
      } else {
        attr = `data-add="${d}|${s}"`;
      }
      rows += `<td class="${cls.join(' ')}" rowspan="${rowspan}" ${attr}>${inner}</td>`;
    }
    rows += `</tr>`;
  }
  rows += `</tbody></table>`;
  return `<div class="grid-wrap">${rows}</div>`;
}

function currentSection(){
  const m = new Date().getHours()*60 + new Date().getMinutes();
  for (let i=0;i<state.times.length;i++){
    const [h0,m0]=state.times[i][0].split(':').map(Number);
    const [h1,m1]=state.times[i][1].split(':').map(Number);
    if (m>=h0*60+m0 && m<=h1*60+m1) return i;
  }
  return -1;
}

/* ================= 日视图 ================= */
function dayCard(c){
  const badge = (c.weeks && c.weeks.length) ? `<span class="badge">${fmtWeeks(c.weeks)}</span>` : '';
  if (c.type === 'plan'){
    return `<div class="card plan" style="background:${hexRgba(c.color,0.12)};color:${c.color}" data-id="${c.id}">
      ${badge}
      <div class="nm">📌 ${esc(c.name)}</div>
      <div class="meta">
        ${c.room?`<span>📍 ${esc(c.room)}</span>`:''}
        ${c.note?`<span>✏️ ${esc(c.note)}</span>`:''}
      </div>
    </div>`;
  }
  return `<div class="card" style="background:${c.color}" data-id="${c.id}">
    ${badge}
    <div class="nm">${esc(c.name)}</div>
    <div class="meta">
      ${c.teacher?`<span>👨‍🏫 ${esc(c.teacher)}</span>`:''}
      ${c.room?`<span>📍 ${esc(c.room)}</span>`:''}
      ${c.note?`<span>📌 ${esc(c.note)}</span>`:''}
    </div>
  </div>`;
}
function buildDay(){
  const d = selectedDay;
  const w = viewWeek();
  const list = state.courses.filter(c=>c.day===d && inWeek(c,w)).sort((a,b)=>a.startSection-b.startSection);
  let tabs = `<div class="weekbar" style="padding:0 0 10px">`;
  DAY_NAMES.forEach((dn,i)=>{ tabs += `<span class="chip ${i===d?'on':''}" data-day="${i}">${dn}</span>`; });
  tabs += `</div>`;

  let html = `<div class="dayview"><div class="day-head">${DAY_NAMES[d]}<small>第 ${w} 周${d===todayIdx?' · 今天':''}</small></div>`;
  if (list.length===0){
    html += `<div class="empty"><div class="big">🗓️</div>${d===todayIdx?'今天':'这天'}（第 ${w} 周）没课<br>点右下角 ＋ 添加课程</div>`;
  } else {
    list.forEach(c=>{
      const t = state.times[c.startSection-1][0] + ' - ' + state.times[c.endSection-1][1];
      html += `<div class="slot">
        <div class="when"><b>${c.startSection}-${c.endSection}</b>${t}</div>
        ${dayCard(c)}
      </div>`;
    });
  }
  html += `</div>`;
  return tabs + html;
}

/* ================= 事件委托 ================= */
$('main').addEventListener('click', e=>{
  const chip = e.target.closest('.chip[data-day]');
  if (chip){ selectedDay = +chip.dataset.day; render(); return; }
  const el = e.target.closest('[data-id]');
  if (el){ openEditor(el.dataset.id); return; }
  const add = e.target.closest('[data-add]');
  if (add){ const [d,s] = add.dataset.add.split('|').map(Number); pickTypeThenAdd(d, s+1); }
});
$('weekbar').addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if (nav){ setWeek(viewWeek() + (+nav.dataset.nav)); return; }
  const jump = e.target.closest('[data-jump]');
  if (jump){
    const v = prompt(`跳转到第几周？（1-${state.totalWeeks}）`, String(viewWeek()));
    if (v!==null){ const n=parseInt(v); if(!isNaN(n)) setWeek(n); }
  }
});
$('viewSeg').addEventListener('click', e=>{ if(e.target.dataset.view) setView(e.target.dataset.view); });
$('btnToday').addEventListener('click', ()=>{ state.viewWeek=null; selectedDay=todayIdx; setView('day'); });
$('fab').addEventListener('click', ()=>openEditor(null, selectedDay));

/* ================= 编辑器 ================= */
let curDay=0, curStart=1, curEnd=2, curColor=PALETTE[0], curType='course';
let weekSel='all', weekCustom='';

function buildDaySeg(){
  let h=''; DAY_NAMES.forEach((d,i)=>{ h+=`<button data-day="${i}" class="${i===curDay?'on':''}">${d.slice(1)}</button>`; });
  $('fDay').innerHTML=h;
}
function buildColors(){
  let h=''; PALETTE.forEach(c=>{ h+=`<div class="sw ${c===curColor?'on':''}" data-c="${c}" style="background:${c}"></div>`; });
  $('fColor').innerHTML=h;
}
function resolveWeeks(){
  if (weekSel==='odd') return rangeOdd(state.totalWeeks);
  if (weekSel==='even') return rangeEven(state.totalWeeks);
  if (weekSel==='custom') return parseWeekText($('fWeekCustom').value, state.totalWeeks);
  return [];
}
function syncWeekUI(){
  document.querySelectorAll('#fWeeks button').forEach(b=>b.classList.toggle('on', b.dataset.w===weekSel));
  $('fWeekCustomWrap').style.display = weekSel==='custom' ? '' : 'none';
  if (weekSel==='custom') $('fWeekCustom').value = weekCustom;
  const arr = resolveWeeks();
  $('fWeekPreview').innerHTML = arr.length===0
    ? '这门课 <b>每周</b> 都上'
    : `这门课上 <b>${fmtWeeks(arr)}</b>`;
}

function openEditor(id, presetDay, presetStart, presetType){
  editingId = id || null;
  const c = id ? state.courses.find(x=>x.id===id) : null;
  curType = c ? (c.type||'course') : (presetType||'course');
  curDay = c ? c.day : (presetDay!==undefined?presetDay:selectedDay);
  curColor = c ? c.color : PALETTE[Math.floor(Math.random()*PALETTE.length)];
  curStart = c ? c.startSection : (presetStart || 1);
  curEnd = c ? c.endSection : Math.min(curStart+1, state.times.length);
  // 反推周次选择
  if (c && c.weeks && c.weeks.length){
    if (arrEq(c.weeks, rangeOdd(state.totalWeeks))) weekSel='odd';
    else if (arrEq(c.weeks, rangeEven(state.totalWeeks))) weekSel='even';
    else { weekSel='custom'; weekCustom = compressWeeks(c.weeks); }
  } else { weekSel='all'; weekCustom=''; }
  $('mHint').textContent = c ? '' : '填写后点保存，会显示在对应星期的课表里';
  $('fName').value = c?c.name:''; $('fTeacher').value=c?c.teacher:''; $('fRoom').value=c?c.room:''; $('fNote').value=c?c.note:'';
  $('fDelete').style.display = c ? '' : 'none';
  buildDaySeg(); buildColors(); syncVals(); syncWeekUI(); syncTypeUI();
  $('mask').classList.add('show');
}
function syncTypeUI(){
  document.querySelectorAll('#fType button').forEach(b=>b.classList.toggle('on', b.dataset.t===curType));
  $('fTeacherField').style.display = curType==='plan' ? 'none' : '';
  $('fRoomLabel').textContent = curType==='plan' ? '地点' : '教室';
  $('fRoom').placeholder = curType==='plan' ? '如：图书馆 3 楼' : '如：教一 201';
  $('fNameLabel').textContent = curType==='plan' ? '计划名称 *' : '课程名称 *';
  $('fName').placeholder = curType==='plan' ? '如：自习 / 健身 / 社团活动' : '如：高等数学';
  $('mTitle').textContent = editingId
    ? (curType==='plan' ? '编辑计划' : '编辑课程')
    : (curType==='plan' ? '添加课外计划' : '添加课程');
}
function syncVals(){ $('fStartV').textContent=curStart; $('fEndV').textContent=curEnd; }

$('fDay').addEventListener('click', e=>{ if(e.target.dataset.day!==undefined){ curDay=+e.target.dataset.day; buildDaySeg(); } });
$('fType').addEventListener('click', e=>{ if(e.target.dataset.t){ curType=e.target.dataset.t; syncTypeUI(); } });
$('fWeeks').addEventListener('click', e=>{
  if(e.target.dataset.w){ weekSel=e.target.dataset.w; syncWeekUI(); }
});
$('fWeekCustom').addEventListener('input', ()=>{ weekCustom=$('fWeekCustom').value; syncWeekUI(); });
$('fColor').addEventListener('click', e=>{ if(e.target.dataset.c){ curColor=e.target.dataset.c; buildColors(); } });

document.querySelectorAll('.num-stepper').forEach(grp=>{
  grp.addEventListener('click', e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const isStart = grp.querySelector('.val').id==='fStartV';
    const step = +btn.dataset.step;
    if (isStart){ curStart = clamp(curStart+step,1,state.times.length); if(curEnd<curStart) curEnd=curStart; }
    else { curEnd = clamp(curEnd+step,1,state.times.length); if(curEnd<curStart) curStart=curEnd; }
    syncVals();
  });
});

$('fSave').addEventListener('click', ()=>{
  const name = $('fName').value.trim();
  if (!name){ toast(curType==='plan'?'请填写计划名称':'请填写课程名称'); $('fName').focus(); return; }
  const weeks = resolveWeeks();
  const obj = { name, teacher: curType==='plan' ? '' : $('fTeacher').value.trim(), room:$('fRoom').value.trim(), note:$('fNote').value.trim(),
    day:curDay, startSection:curStart, endSection:curEnd, weeks, color:curColor, type:curType };
  if (editingId){ const i=state.courses.findIndex(x=>x.id===editingId); state.courses[i]=Object.assign(state.courses[i], obj); }
  else state.courses.push(Object.assign({id:uid()}, obj));
  save(); closeEditor(); render();
});
$('fDelete').addEventListener('click', ()=>{
  state.courses = state.courses.filter(x=>x.id!==editingId);
  save(); closeEditor(); render(); toast('已删除');
});
$('fCancel').addEventListener('click', closeEditor);
$('mask').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeEditor(); });
function closeEditor(){ $('mask').classList.remove('show'); }
function pickTypeThenAdd(day, section){
  const items = [['course','📚 添加课程','实心色块，含教师/教室'],['plan','📌 添加课外计划','虚线样式，含地点/备注']];
  let h = `<div class="sheet"><h3>在 ${DAY_NAMES[day]} · 第 ${section} 节 添加</h3><p class="sub-hint">课程与计划用不同样式区分</p>`;
  items.forEach(([t,label,desc])=>{ h+=`<button class="btn" data-t="${t}" style="width:100%;margin-bottom:8px;justify-content:flex-start;padding:13px;text-align:left"><span style="margin-right:8px">${label}</span><small style="color:var(--text-2)">${desc}</small></button>`; });
  h+=`<div class="sheet-actions"><button class="btn" data-t="cancel" style="flex:1;justify-content:center;padding:13px">取消</button></div></div>`;
  const mask=document.createElement('div'); mask.className='mask show'; mask.innerHTML=h;
  mask.addEventListener('click', e=>{
    const btn=e.target.closest('[data-t]'); if(!btn) return;
    mask.remove();
    if(btn.dataset.t!=='cancel') openEditor(null, day, section, btn.dataset.t);
  });
  document.body.appendChild(mask);
}

/* ================= 菜单 ================= */
$('btnMenu').addEventListener('click', ()=>{
  const items = [
    ['导出备份', exportJSON],
    ['导入备份', importJSON],
    ['清空课表', clearAll],
    ['节次时间设置', editTimes],
    ['设置开学日期', editSemester],
    ['本学期总周数', editTotalWeeks],
  ];
  showMenu(items);
});
function showMenu(items){
  let h = `<div class="sheet"><h3>菜单</h3><p class="sub-hint">共 ${state.courses.length} 门课程</p>`;
  items.forEach(([label,fn],i)=>{ h+=`<button class="btn" data-mi="${i}" style="width:100%;margin-bottom:8px;justify-content:flex-start;padding:13px">${label}</button>`; });
  h+=`<div class="sheet-actions"><button class="btn" data-mi="close" style="flex:1;justify-content:center;padding:13px">关闭</button></div></div>`;
  const mask=document.createElement('div'); mask.className='mask show'; mask.innerHTML=h;
  mask.addEventListener('click', e=>{
    const mi=e.target.closest('[data-mi]'); if(!mi) return;
    mask.remove();
    if(mi.dataset.mi==='close') return;
    items[+mi.dataset.mi][1]();
  });
  document.body.appendChild(mask);
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='课表备份.json'; a.click();
  toast('已导出 JSON 备份');
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if (Array.isArray(data.courses)){
        data.courses.forEach(c=>{ if(typeof c.weeks==='string'){ c.weeks = c.weeks==='odd'?rangeOdd(state.totalWeeks):c.weeks==='even'?rangeEven(state.totalWeeks):[]; } });
        state.courses=data.courses; state.times=data.times||state.times; state.totalWeeks=data.totalWeeks||state.totalWeeks;
        save(); render(); toast('导入成功');
      } else toast('格式不正确');
    }catch(e){ toast('导入失败：文件无法解析'); } };
    r.readAsText(file);
  };
  inp.click();
}
function clearAll(){
  if (window.confirm('确定清空全部课程？此操作不可撤销。')){ state.courses=[]; save(); render(); toast('已清空'); }
}
function editTimes(){
  const cur = state.times.map(t=>t.join('-')).join('\n');
  const v = window.prompt('每行一个节次，格式「开始-结束」（如 08:00-08:45）：', cur);
  if (v===null) return;
  const lines = v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{ const p=s.split('-'); return [p[0], p[1]]; });
  if (lines.length===0){ toast('格式错误'); return; }
  state.times=lines; save(); render(); toast('已更新节次时间');
}
function editSemester(){
  const v = window.prompt('本学期开学日期（填某周一的日期），格式 YYYY-MM-DD，留空则不做自动算周：', state.semesterStart||'');
  if (v===null) return;
  state.semesterStart = v.trim(); save(); render(); toast(state.semesterStart?'已设置开学日期':'已清除');
}
function editTotalWeeks(){
  const v = window.prompt('本学期共几周？（用于单双周展开和跳转上限）', String(state.totalWeeks));
  if (v===null) return;
  const n=parseInt(v);
  if(!isNaN(n) && n>0){ state.totalWeeks=n; save(); render(); toast('总周数已设为 '+n); }
}

/* ================= 其他 ================= */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2000); }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
setView(state.view);
</script>
</body>
